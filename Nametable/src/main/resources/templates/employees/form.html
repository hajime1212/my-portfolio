<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${employee.id == null ? '新規登録' : '編集'}"></title>
<!-- <meta name="viewport" content="width=device-width, initial-scale=1.0">  -->
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div>
		<h1 th:text="${employee.id == null ? '新規登録' : '編集'}"></h1>

		<form
			th:action="${employee.id == null ? '/employees' : '/employees/' + employee.id}"
			th:object="${employee}" method="post">

			<div>
				<label for="name">名前</label> 
				<input type="text" id="name"th:field="*{name}" />
				<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
					class="error-message"></div>
			</div>
			<div>
				<label for="password">パスワード:</label>
				<input type="password" id="password" th:field="*{password}" />
				<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div>
			<div>
				<label for="email">メールアドレス:</label> <input type="text" id="email"
					th:field="*{email}" />
				<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
					class="error-message"></div>
			</div>
			<div>
				<label for="department">部署:</label> 
				<select id="department" th:field="*{department}" required>
					<option th:each="dept : ${departments}" 
							th:value="${dept.id}"
							th:text="${dept.name}"></option>
				</select>

			</div>
			
			<div>

				<button type="submit" th:text="${employee.id == null ? '登録' : '更新'}"></button>
				<a href="/employees">一覧へ戻る</a>
			</div>
		</form>
	</div>



</body>
</html>
