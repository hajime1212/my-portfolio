# ワークフローの名前
name: Java CI with Maven

# きっかけ（masterブランチへのプッシュ）
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 手順1: コードのチェックアウト
      - uses: actions/checkout@v4

      # 手順2: Javaのセットアップ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # ✅ "with:" の下にあるこの2行は、
          #    2スペース分インデント（字下げ）します
          java-version: '17'
          distribution: 'temurin'

      # 手順3: Mavenでビルドを実行
      # ✅ 次のステップの "-" は、上のステップの "-" と
      #    同じ階層（インデント）にそろえます
      - name: Build with Maven
        run: mvn -B package --file pom.xml
